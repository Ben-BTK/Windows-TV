name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller pytest

      - name: Run parser tests
        run: python -m pytest -q

      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --name WindowsTV --paths src src/windows_tv/__main__.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile two-mode installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer/Windows-TV.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-tv-setup
          path: |
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14
