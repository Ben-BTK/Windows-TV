[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flemmau-tv"
version = "0.1.0.dev0"
description = "FlemmauTV – Windows-Client für unterstützte Netzwerk-TV- und Streamquellen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
